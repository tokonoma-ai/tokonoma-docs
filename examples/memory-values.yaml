# Copy once as tokonoma-values.yaml for a new installation.
# Complete analysis and runner setup using references/install.md.
# PostgreSQL and local search embeddings use the chart defaults.
mcp:
  auth:
    # For private, local access only. Any caller that can reach MCP can use it.
    # Configure authentication before shared access; see references/private-access.md.
    enabled: false
  ingress:
    # Use a local port-forward first. Public access needs TLS and authentication.
    enabled: false
  storage:
    # Attachment storage is disabled in this installation.
    backend: none
  # Supply your Tokonoma-issued license with --set-file mcp.license=.../license.txt.
  # Or use your Secret owner's name and key below, omitting the license file input:
  # licenseSecret:
  #   name: REPLACE_WITH_LICENSE_SECRET_NAME
  #   key: REPLACE_WITH_LICENSE_SECRET_KEY
