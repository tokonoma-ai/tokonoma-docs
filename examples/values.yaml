# Without supplied or existing values, copy this file to your working directory as values.yaml.
# With custom values, use this example to fill missing requirements; keep customer choices.
# Existing installation: edit your saved file; do not replace it with this example.
# The runner, Agentic Monitoring and automatic investigations are enabled for this install.
# Ask whether to turn either automatic feature off; see references/install.md.
# Preserve supplied choices unless the customer asks to change them.
# Uncomment only integrations you use.
# Supply credentials directly in the installation command or use existing Secret
# references. See references/install.md and references/credentials.md.
# Replace placeholders with verified values; agents ask for missing inputs.
# PostgreSQL, local search embeddings and application images use chart defaults.
mcp:
  # Supply your issued license with --set-literal 'mcp.license=...', or use this existing Secret:
  # licenseSecret:
  #   name: REPLACE_WITH_LICENSE_SECRET_NAME
  #   key: REPLACE_WITH_LICENSE_SECRET_KEY
  auth:
    # Authenticated local access; the installer provisions the runner's machine login.
    # Requires the native-auth releases in references/upgrading.md.
    # Keep supplied or existing authentication when adapting this example.
    enabled: true
    baseUrl: http://localhost:8000
    provider: none
  ingress:
    # Use a local port-forward first. Public access needs TLS and authentication.
    enabled: false
  storage:
    # Attachment storage is disabled.
    backend: none
  sibling:
    # Required: the runner's dedicated MCP instance, sharing your database.
    enabled: true
  memoryLlm:
    # Required. Uses the Anthropic API; the same key also serves the runner.
    enabled: true
    # Alternative to credentials.anthropicApiKey: an existing Anthropic key Secret.
    # apiKeySecret:
    #   name: REPLACE_WITH_ANTHROPIC_SECRET_NAME
    #   key: REPLACE_WITH_ANTHROPIC_SECRET_KEY
  # Slack: follow references/slack-app.md and supply both Slack tokens in the command.
  # Uncomment this section and runner.destinations.slackApp below for Slack results.
  # slack:
  #   autoRecallEnabled: false # Immediate recall replies are separate from investigations.
  #   investigationsChannel: tokonoma-investigations # Invite the app to this channel.
  #   # Existing Secret alternative to the two token arguments:
  #   # tokenSecret:
  #   #   name: REPLACE_WITH_SLACK_SECRET_NAME
  #   #   botTokenKey: REPLACE_WITH_SLACK_BOT_TOKEN_KEY
  #   #   appTokenKey: REPLACE_WITH_SLACK_APP_TOKEN_KEY

runner:
  # Required: needs the sibling, model credentials, and monitoring, Slack requests, or an alert source.
  enabled: true
  ingress:
    # External senders can use a separate webhook route while MCP stays private.
    enabled: false
  detection:
    # Monitoring uses the runner's model and can start investigations automatically.
    # Set false only if the customer opts out; remove unused scope placeholders.
    # Setup and checks: references/agentic-monitoring.md.
    enabled: true
    scope:
      # Use the monitored Kubernetes cluster's exact name in telemetry, not its context.
      # For ECS monitoring, confirm support with Tokonoma before filling this scope.
      # Do not substitute the Kubernetes cluster hosting Tokonoma for ECS workloads.
      cluster: REPLACE_WITH_MONITORED_CLUSTER
      # Exact namespace names. Use [] only to intentionally watch all, including system ones.
      namespaces: [REPLACE_WITH_MONITORED_NAMESPACE]
  # Both automatic features need telemetry query access, such as Grafana or telemetry MCP.
  # Alert webhooks and code-only connections do not supply that access.

  # Only if the customer asks to pause all automatic investigations:
  # guardrails:
  #   maxRunsPerDay: 0
  #   maxRunsPerDayCritical: 0
  # Includes monitoring findings; manual investigations remain available.
  # Details and resuming: references/alert-investigations.md#pause-automatic-investigations.

  # The runner uses the Anthropic API only; credentials.anthropicApiKey serves both.
  # For an existing Secret, configure this AND mcp.memoryLlm.apiKeySecret above:
  # engine:
  #   apiKeySecret:
  #     name: REPLACE_WITH_ANTHROPIC_SECRET_NAME
  #     key: REPLACE_WITH_ANTHROPIC_SECRET_KEY

  # Alert sources: the walkthrough supplies credentials.alertmanagerToken in the command.
  # Uncomment sources and only selected entries. Datadog needs no Alertmanager Secret.
  # sources:
  #   alertmanager:
  #     tokenSecretRef:
  #       name: REPLACE_WITH_ALERTMANAGER_SECRET_NAME
  #       key: REPLACE_WITH_ALERTMANAGER_SECRET_KEY
  #   datadog: # Create this Secret using references/datadog-alerts.md.
  #     tokenSecretRef:
  #       name: toko-runner-datadog-webhook
  #       key: token

  # External alerts need an HTTPS webhook route; see references/datadog-alerts.md.
  # A separate route can keep MCP private. Leave both chart ingress switches off for it.
  # The chart-managed route below shares MCP ingress and requires MCP authentication.
  # Merge it into runner.ingress above rather than adding a second ingress key.
  # Use /webhooks/alertmanager for Alertmanager, or list both paths for both sources.
  # ingress:
  #   enabled: true
  #   webhookPaths: [/webhooks/datadog]

  # Slack results: needs both Slack tokens and channel membership configured above.
  # Do not also enable the legacy webhook destination unless you want two deliveries.
  # destinations:
  #   slackApp:
  #     enabled: true

  # Leave tokoMcp.url and tokoMcp.oauthClientSecretRef unset for the generated local login.
  # Keep existing working credentials on upgrades. GitOps or an external MCP needs an
  # explicit Secret reference and client declaration; see references/alert-investigations.md.

  # Uncomment mcpServers and only the connections you use. Keep one combined list.
  # Remote HTTP MCP: Datadog, Axiom or another compatible telemetry/code provider.
  # Get the endpoint and exact read-only tool names from the provider; no mcp__ prefix.
  # List read-only tools only: unattended Agentic Monitoring can call every listed tool.
  # Use a unique lowercase name; reserve toko and the bundled adapter's grafana name.
  # Provider examples and credential setup: references/integrations.md#mcp-connections.
  # mcpServers:
  #   - name: telemetry
  #     kind: telemetry
  #     url: REPLACE_WITH_TELEMETRY_MCP_URL
  #     expectedTools: [REPLACE_WITH_TELEMETRY_TOOL_NAME]
  #     authSecretRef:
  #       # Raw bearer token, without the "Bearer " prefix.
  #       name: REPLACE_WITH_TELEMETRY_SECRET_NAME
  #       key: REPLACE_WITH_TELEMETRY_SECRET_KEY
  #     # Named-header alternative, shown for Datadog API/application keys.
  #     # Remove authSecretRef above before uncommenting headers; do not use both.
  #     # headers:
  #     #   - header: DD_API_KEY
  #     #     secretRef:
  #     #       name: REPLACE_WITH_DATADOG_API_KEY_SECRET_NAME
  #     #       key: REPLACE_WITH_DATADOG_API_KEY_SECRET_KEY
  #     #   - header: DD_APPLICATION_KEY
  #     #     secretRef:
  #     #       name: REPLACE_WITH_DATADOG_APP_KEY_SECRET_NAME
  #     #       key: REPLACE_WITH_DATADOG_APP_KEY_SECRET_KEY
  #   - name: github # Optional code access; see references/integrations.md#github-example.
  #     kind: source-control
  #     url: https://api.githubcopilot.com/mcp/readonly
  #     expectedTools: [get_file_contents, search_code, get_commit, list_commits]
  #     authSecretRef:
  #       name: toko-runner-github
  #       key: token

# Grafana: optional query adapter, separate from Tokonoma's self-monitoring UI.
# Uncomment this section if you use Grafana; obtain its base URL from its administrator.
# grafanaMcp:
#   enabled: true
#   grafana:
#     url: REPLACE_WITH_GRAFANA_URL
#     # Supply a Viewer token with --set-literal 'grafanaMcp.grafana.apiKey=...'.
#     # Existing Secret alternative: uncomment the next four lines together.
#     # Empty apiKey clears any old inline token that would take precedence.
#     # apiKey: ""
#     # apiKeySecret:
#     #   name: REPLACE_WITH_GRAFANA_SECRET_NAME
#     #   key: REPLACE_WITH_GRAFANA_SECRET_KEY
#   # Separate runner-to-adapter caller token; Helm creates it by default.
#   # Existing Secret alternative; leave commented for normal Helm installation:
#   # auth:
#   #   createSecret: false
#   # envValueFrom:
#   #   MCP_GRAFANA_SERVER_TOKEN:
#   #     secretKeyRef:
#   #       name: REPLACE_WITH_GRAFANA_CALLER_SECRET_NAME
#   #       key: REPLACE_WITH_GRAFANA_CALLER_SECRET_KEY

# Referenced Secrets must exist in the release namespace before installation.
# Secret owners supply their names and keys. Never put token values in this file.
