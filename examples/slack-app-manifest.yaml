# Tokonoma application 0.68.0. Create one app for your deployment/workspace.
# Generate the app-level connections:write token separately in Slack.
# Setup: ../docs/guides/slack-app.md
display_information:
  name: Tokonoma
  description: Your expertise for every agent.
  background_color: "#140B03"

features:
  bot_user:
    display_name: Tokonoma
    always_online: false

oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - channels:history
      - groups:history
      - users:read
      - channels:read
      - groups:read
      # Present in the release manifest; this release still needs invitations.
      - channels:join
      - chat:write
      - reactions:write

settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - message.channels
      - message.groups
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
