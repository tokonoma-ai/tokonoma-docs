# Create one Tokonoma app for your deployment/workspace.
# Generate the app-level connections:write token separately in Slack.
# After installing the app, run /invite @Tokonoma in each chosen channel.
# People can invite the app to public or private channels; it does not join automatically.
# Setup: ../references/slack-app.md
display_information:
  name: Tokonoma
  description: Your reliability and observability teammate.
  background_color: "#140B03"

features:
  bot_user:
    display_name: Tokonoma
    always_online: false

oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - channels:history
      - groups:history
      - users:read
      - channels:read
      - groups:read
      # Invite the app explicitly; it does not join channels automatically.
      - channels:join
      - chat:write
      - reactions:write
      # Read feedback on monitoring results.
      - reactions:read
      # Upload monitoring setup reports.
      - files:write

settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - message.channels
      - message.groups
      - reaction_added
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
