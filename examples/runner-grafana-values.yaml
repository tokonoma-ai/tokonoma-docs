# Copy as runner-values.yaml and apply after your saved tokonoma-values.yaml.
# This overlay preserves your existing authentication, routing, and storage.
# Replace placeholders with verified inputs; agents ask for missing inputs.
# Supply protected credential files using references/alert-investigations.md.
mcp:
  sibling:
    # Required: dedicated MCP instance for the runner, sharing your database.
    enabled: true
  memoryLlm:
    # Required: Anthropic analysis, even if the runner uses another provider.
    # Supply credentials.anthropicApiKey or an existing mcp.memoryLlm.apiKeySecret.
    enabled: true
  slack:
    # Optional immediate recall replies to alerts. This does not stop investigations.
    autoRecallEnabled: false
    # Supply both Slack tokens, or an existing tokenSecret; see references/credentials.md.
    # Invite Tokonoma to tokonoma-investigations, or set your invited channel here:
    # investigationsChannel: REPLACE_WITH_SLACK_CHANNEL_NAME

runner:
  # Required: needs the sibling, model credentials, and at least one alert-source token.
  # This example uses Anthropic and Alertmanager credentials supplied by the Helm command.
  enabled: true
  # Existing Secrets: runner.engine.apiKeySecret and runner.sources.alertmanager.tokenSecretRef.
  # Use the name and key from your Secret owner; see references/credentials.md.
  # Authenticated MCP also needs tokoMcp.oauthClientSecretRef; see the runner guide.
  destinations:
    slackApp:
      # Deliver results through the native Slack app. Both Slack tokens are required.
      # Leave the legacy Slack webhook destination unset to avoid duplicate delivery.
      enabled: true

grafanaMcp:
  # Optional adapter for an existing Grafana, separate from Tokonoma self-monitoring.
  # Without Grafana, remove this block and configure your actual investigation tools.
  enabled: true
  grafana:
    # Existing Grafana base URL from its administrator; reachable from this cluster.
    url: REPLACE_WITH_GRAFANA_URL
    # Supply a Viewer service-account token through --set-file grafanaMcp.grafana.apiKey.
    # Or uncomment all lines below; empty apiKey prevents an old inline token taking precedence:
    # apiKey: ""
    # apiKeySecret:
    #   name: REPLACE_WITH_GRAFANA_SECRET_NAME
    #   key: REPLACE_WITH_GRAFANA_SECRET_KEY
  # Separate caller token for runner-to-adapter access, not the Grafana Viewer token.
  # Helm creates it by default. To use an existing Secret, uncomment this block:
  # auth:
  #   createSecret: false
  # envValueFrom:
  #   MCP_GRAFANA_SERVER_TOKEN:
  #     secretKeyRef:
  #       name: REPLACE_WITH_GRAFANA_CALLER_SECRET_NAME
  #       key: REPLACE_WITH_GRAFANA_CALLER_SECRET_KEY
  # Referenced Secrets must exist in the release namespace before upgrading.
